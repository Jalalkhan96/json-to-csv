[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "json-to-csv"
version = "1.0.0"
description = "Convert a JSON array of objects (or a single object) to CSV — file or stdin, with field selection and nested-object flattening."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jalal Khan" }]

[project.scripts]
json-to-csv = "json_to_csv.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["json_to_csv*"]
